<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>迷你播放器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    /* 全局玻璃透明度（设置·外观·GLOBAL）：mini.js 启动时把 settings.glass 写入 --glass-a，
       --glass-a2 深一档自动跟随；悬浮于桌面需更实，故胶囊背景取 --glass-a2 */
    :root { --glass-a: 0.45; --glass-a2: calc(var(--glass-a) + 0.18); }
    html, body { background: transparent; overflow: hidden; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    #bar {
      display: flex; align-items: center; gap: 12px;
      height: 72px; margin: 10px;
      padding: 0 14px;
      border-radius: 22px;
      background: rgba(10, 11, 14, var(--glass-a2));
      backdrop-filter: blur(28px) saturate(1.7);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.09);
      -webkit-app-region: drag;
      cursor: default;
    }
    #cover {
      width: 46px; height: 46px; flex: none;
      border-radius: 12px; object-fit: cover;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      -webkit-app-region: no-drag;
    }
    .meta { flex: 1; min-width: 0; -webkit-app-region: no-drag; }
    #title { font-size: 12.5px; font-weight: 650; color: rgba(255, 255, 255, 0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #artist { font-size: 10px; color: rgba(138, 144, 153, 0.9); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btns { display: flex; align-items: center; gap: 4px; -webkit-app-region: no-drag; }
    button {
      width: 30px; height: 30px;
      border: none; border-radius: 999px;
      background: transparent;
      color: rgba(232, 236, 239, 0.75);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.18s, color 0.18s, transform 0.18s;
    }
    button:hover { background: rgba(255, 255, 255, 0.1); color: #fff; transform: scale(1.08); }
    #btnToggle { width: 38px; height: 38px; font-size: 15px; color: #00f5d4; background: rgba(0, 245, 212, 0.1); box-shadow: inset 0 0 0 1px rgba(0, 245, 212, 0.25); }
    #btnToggle:hover { background: rgba(0, 245, 212, 0.18); }
    #btnClose { font-size: 11px; opacity: 0.5; }
  </style>
</head>
<body>
  <div id="bar">
    <img id="cover" alt="" />
    <div class="meta">
      <div id="title">未播放</div>
      <div id="artist">迷你悬浮播放器 · 可拖动</div>
    </div>
    <div class="btns">
      <button id="btnPrev" title="上一首">⏮</button>
      <button id="btnToggle" title="播放/暂停">▶</button>
      <button id="btnNext" title="下一首">⏭</button>
      <button id="btnClose" title="关闭迷你窗">✕</button>
    </div>
  </div>
  <script src="js/mini.js"></script>
</body>
</html>
